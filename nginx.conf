server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(svg|png|jpg|webp|ico|xml|txt)$ { expires 7d; add_header Cache-Control "public"; }
    location ~* \.(css|js)$ { add_header Cache-Control "no-cache"; }
    location /cv/ { try_files $uri =404; types { application/pdf pdf; } default_type application/pdf; add_header Cache-Control "no-cache"; }

    location / { try_files $uri $uri/ /index.html; }
}
