# Cache-Control por tipo de archivo. Se calcula aquí para que ningún location use add_header:
# en nginx, un add_header dentro de un location descarta todos los del server (y con ellos la seguridad).
map $uri $cache_control {
    ~*\.(svg|png|jpg|webp|ico|xml|txt)$  "public, max-age=604800";
    default                              "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

    location /cv/ { try_files $uri =404; types { application/pdf pdf; } default_type application/pdf; }

    location / { try_files $uri $uri/ /index.html; }
}
